name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  go-build:
    name: Go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o mailbridge .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: mailbridge-linux-amd64
          path: mailbridge
          if-no-files-found: error

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t mailbridge:ci .
